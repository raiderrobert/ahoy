[package]
name = "ahoy"
version = "0.1.5"
edition = "2024"
description = "Desktop notifications for LLM coding agents"
license-file = "LICENSE"
repository = "https://github.com/raiderrobert/ahoy"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"


[dev-dependencies]
tempfile = "3.12"
