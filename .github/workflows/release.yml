name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and release (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        run: cargo build --release

      - name: Build Swift helper
        run: make -C swift build sign

      - name: Code sign Rust binary
        run: codesign -s - target/release/ahoy

      - name: Create release archive
        run: |
          mkdir -p release/ahoy
          cp target/release/ahoy release/ahoy/
          cp -R Ahoy.app release/ahoy/
          cp install.sh release/ahoy/
          cp uninstall.sh release/ahoy/
          cp README.md release/ahoy/
          cd release && tar -czvf ahoy-macos-arm64.tar.gz ahoy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahoy-macos-arm64
          path: release/ahoy-macos-arm64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ahoy-macos-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ahoy-macos-arm64.tar.gz
